<!DOCTYPE html>

<head>

<title>我的數位名片</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background:#fff; font-family: -apple-system, "PingFang TC", sans-serif; display:flex; justify-content:center; }
  .phone { width: 100%; max-width: 430px; background:#fff; }
  .card-wrap { position: relative; width: 100%; line-height:0; }
  .card-wrap img { width: 100%; display:block; }

  /* 五個浮動圖示：疊在圖片右側「乾淨無內容」的直向色帶上，
     用百分比定位，不管圖片實際顯示寬度多少都會等比例對齊同一個位置 */
  .icon {
    position:absolute;
    width: 7.15%;          /* 比原本大 15%，對應原圖約 77px 直徑 */
    aspect-ratio: 1/1;
    right: 8.0%;           /* 維持置中在原圖乾淨色帶內，跟著放大微調 */
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 8px rgba(0,0,0,.22);
  }
  .icon svg { width: 52%; height: 52%; }

  .icon-contact { top: 51.5%; background:#1878F0; }
  .icon-line    { top: 57.3%; background:#06C755; }
  .icon-web     { top: 63.1%; background:#3ECB6A; }
  .icon-form    { top: 68.9%; background:#FC9B12; }
  .icon-map     { top: 74.7%; background:#4D8CF2; }
</style>
</head>
<body>

<div class="phone">
